    <!-- ================================
         CONTACT SECTION
    ================================= -->

    <section class="contactpg" id="contact">

        <!-- Section Heading -->
        <h3>Contact Me</h3>


        <div class="consubpg">


            <!-- ================================
                 CONTACT INFORMATION
            ================================= -->

            <div class="contactinfo">

                <h4>Get in Touch</h4>

                <p>
                    Feel free to reach out to me using the form below
                    or by email at example@email.com.
                </p>


                <!-- Contact Icons -->
                <div class="conicon">


                    <!-- PHONE -->
                    <p>
                        <a href="tel:+234XXXXXXXXXX"
                           aria-label="Call me">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path
                                    d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384">
                                </path>

                            </svg>

                        </a>
                    </p>


                    <!-- EMAIL -->
                    <p>
                        <a href="mailto:example@email.com"
                           aria-label="Send me an email">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path
                                    d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7">
                                </path>

                                <rect
                                    x="2"
                                    y="4"
                                    width="20"
                                    height="16"
                                    rx="2">
                                </rect>

                            </svg>

                        </a>
                    </p>


                    <!-- WHATSAPP -->
                    <p>
                        <a
                            href="https://wa.me/234XXXXXXXXXX"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Chat with me on WhatsApp">

                            <i class="fa-brands fa-whatsapp"></i>

                        </a>
                    </p>

                </div>

            </div>



            <!-- ================================
                 CONTACT FORM
            ================================= -->

            <form
                class="contactform"
                id="contact-form"
                action="https://api.web3forms.com/submit"
                method="POST"
            >


                <!-- ================================
                     WEB3FORMS ACCESS KEY
                ================================= -->

                <input
                    type="hidden"
                    name="access_key"
                    value="apikey"
                    
                >


                <!-- Email subject -->
                <input
                    type="hidden"
                    name="subject"
                    value="New Contact Message - Chidinma Okafor Portfolio"
                >


                <!-- ================================
                     FIRST & LAST NAME
                ================================= -->

                <div class="form-one">

                    <input
                        type="text"
                        id="first-name"
                        name="first_name"
                        placeholder="First name"
                        autocomplete="given-name"
                        required
                    >


                    <input
                        type="text"
                        id="last-name"
                        name="last_name"
                        placeholder="Last name"
                        autocomplete="family-name"
                        required
                    >

                </div>



                <!-- ================================
                     EMAIL & PHONE
                ================================= -->

                <div class="form-two">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >


                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Phone"
                        autocomplete="tel"
                    >

                </div>



                <!-- ================================
                     MESSAGE
                ================================= -->

                <textarea
                    id="message"
                    name="message"
                    placeholder="Message"
                    rows="7"
                    required
                ></textarea>



                <!-- ================================
                     FORM STATUS MESSAGE
                ================================= -->

                <p
                    class="form-message"
                    id="form-message"
                    role="status"
                    aria-live="polite">
                </p>



                <!-- ================================
                     SUBMIT BUTTON
                ================================= -->

                <button
                    type="submit"
                    id="submit-btn">

                    <span id="button-text">
                        Send Message
                    </span>

                </button>

            </form>

        </div>

    </section>



    <!-- ================================
         CONTACT JAVASCRIPT
    ================================= -->

    <script src="scripts/contact.js">

        const response = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                access_key: 'process.env.apikey',
                name: 'John Doe',
                email: 'okaforchijoy111@gmail.com'
            })
        });
    </script>

    <script src="script/script1.js"></script>
